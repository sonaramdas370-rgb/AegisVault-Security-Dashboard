<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AegisVault Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .glass-card { 
      background: rgba(255, 255, 255, 0.03); 
      backdrop-filter: blur(8px); 
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body class="bg-[#050508] text-white p-3">

  <header class="mb-4">
    <h1 class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600">AegisVault Pro</h1>
    <p class="text-[9px] text-gray-500">System Status: <span class="text-green-500">● Operational</span></p>
  </header>

  <!-- Grid 2 columns -->
  <div class="grid grid-cols-2 gap-2">
    <!-- Box 1-12 -->
    <div class="glass-card p-3 rounded-xl flex flex-col justify-between"><i class="fa-solid fa-chart-line text-green-400 text-sm"></i><h3 class="text-[7px] text-gray-500">PROFIT</h3><p class="text-[10px] font-bold">+$2,480</p></div>
    <div class="glass-card p-3 rounded-xl flex flex-col justify-between"><i class="fa-solid fa-fingerprint text-purple-400 text-sm"></i><h3 class="text-[7px] text-gray-500">BIOMETRIC</h3><p class="text-[10px]">Active</p></div>
    <div class="glass-card p-3 rounded-xl flex flex-col justify-between"><i class="fa-brands fa-google text-blue-500 text-sm"></i><h3 class="text-[7px] text-gray-500">GOOGLE</h3><p class="text-[10px]">Connected</p></div>
    <div class="glass-card p-3 rounded-xl flex flex-col justify-between"><i class="fa-brands fa-facebook text-blue-600 text-sm"></i><h3 class="text-[7px] text-gray-500">FACEBOOK</h3><p class="text-[10px]">Linked</p></div>
    <div class="glass-card p-3 rounded-xl flex flex-col justify-between"><i class="fa-brands fa-instagram text-pink-500 text-sm"></i><h3 class="text-[7px] text-gray-500">INSTAGRAM</h3><p class="text-[10px]">Linked</p></div>
    <div class="glass-card p-3 rounded-xl flex flex-col justify-between"><i class="fa-brands fa-github text-white text-sm"></i><h3 class="text-[7px] text-gray-500">GITHUB</h3><p class="text-[10px]">Verified</p></div>
    <div class="glass-card p-3 rounded-xl flex flex-col justify-between"><i class="fa-solid fa-key text-yellow-500 text-sm"></i><h3 class="text-[7px] text-gray-500">BACKUP</h3><p class="text-[10px]">849-201</p></div>
    <div class="glass-card p-3 rounded-xl flex flex-col justify-between"><i class="fa-solid fa-id-card text-yellow-600 text-sm"></i><h3 class="text-[7px] text-gray-500">KYC</h3><p class="text-[10px]">Pending</p></div>
    <div class="glass-card p-3 rounded-xl flex flex-col justify-between"><i class="fa-solid fa-robot text-green-400 text-sm"></i><h3 class="text-[7px] text-gray-500">CAPTCHA</h3><p class="text-[10px]">Passed</p></div>
    <div class="glass-card p-3 rounded-xl flex flex-col justify-between"><i class="fa-solid fa-gauge text-purple-400 text-sm"></i><h3 class="text-[7px] text-gray-500">RATE</h3><p class="text-[10px]">Active</p></div>
    <div class="glass-card p-3 rounded-xl flex flex-col justify-between"><i class="fa-solid fa-network-wired text-green-400 text-sm"></i><h3 class="text-[7px] text-gray-500">IP STATUS</h3><p class="text-[10px]">98.2/100</p></div>
    <div class="glass-card p-3 rounded-xl flex flex-col justify-between"><i class="fa-solid fa-shield text-red-500 text-sm"></i><h3 class="text-[7px] text-gray-500">THREATS</h3><p class="text-[10px]">0 Blocked</p></div>
  </div>

  <script src="//code.tidio.co/q08b1h5jntzru2q6adozdletxhmwfipo.js" async></script>
</body>
</html>
