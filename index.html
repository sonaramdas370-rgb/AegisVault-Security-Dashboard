<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AegisVault Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Glassmorphism Effect */
    .glass-card { 
      background: rgba(255, 255, 255, 0.03); 
      backdrop-filter: blur(10px); 
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.4s ease;
    }
    .glass-card:hover { transform: scale(1.03); border: 1px solid #a855f7; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .live-dot { animation: pulse 1.5s infinite; }
  </style>
</head>
<body class="bg-[#050508] text-white min-h-screen p-4">

  <!-- Header -->
  <header class="mb-6">
    <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-600">AegisVault Pro</h1>
    <p class="text-[10px] text-gray-400">System Status: <span class="text-green-500">● Operational</span></p>
  </header>

  <div class="grid grid-cols-2 gap-4">
    
    <!-- 1. PROFIT/ANALYTICS BOX (The Mass Look) -->
    <div class="glass-card aspect-square p-4 rounded-3xl flex flex-col justify-between">
      <h3 class="text-[9px] font-bold text-gray-400 tracking-widest">PROFIT ANALYTICS</h3>
      <div>
        <div class="text-xl font-bold text-green-400">+$2,480</div>
        <div class="text-[9px] text-green-600 font-bold">▲ 12.5% vs last month</div>
      </div>
    </div>

    <!-- 2. BIOMETRIC -->
    <a href="#" class="glass-card aspect-square p-4 rounded-3xl flex flex-col justify-between">
      <h3 class="text-[9px] font-bold text-gray-400">BIOMETRIC</h3>
      <div class="text-[10px] text-white">FaceID <span class="text-green-500">Active</span></div>
    </a>

    <!-- 3. GOOGLE -->
    <a href="#" class="glass-card aspect-square p-4 rounded-3xl flex flex-col justify-between">
      <h3 class="text-[9px] font-bold text-gray-400">GOOGLE</h3>
      <div class="text-[10px] text-blue-400">Connected</div>
    </a>

    <!-- 4. THREATS -->
    <a href="#" class="glass-card aspect-square p-4 rounded-3xl flex flex-col justify-between">
      <h3 class="text-[9px] font-bold text-gray-400">THREATS</h3>
      <div class="text-[10px] text-red-500">0 Blocked</div>
    </a>

    <!-- 5. GITHUB -->
    <a href="#" class="glass-card aspect-square p-4 rounded-3xl flex flex-col justify-between">
      <h3 class="text-[9px] font-bold text-gray-400">GITHUB</h3>
      <div class="text-[10px] text-gray-300">Verified</div>
    </a>

    <!-- 6. IP REPUTATION -->
    <a href="#" class="glass-card aspect-square p-4 rounded-3xl flex flex-col justify-between">
      <h3 class="text-[9px] font-bold text-gray-400">IP STATUS</h3>
      <div class="text-[12px] text-green-400 font-mono">98.2/100</div>
    </a>

  </div>
</body>
</html>
